name: Nx Workspace CI

on:
  pull_request:
    branches: main

jobs:
  lint-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - run: npm ci

      - name: Run affected lint and test
        run: npx nx affected -t lint,test --base=origin/${{ github.base_ref }} --head=HEAD
